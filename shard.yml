name: asciicrystal-revealjs
version: 5.2.0.3

description: |
  AsciiDoc to reveal.js HTML presentation converter for Crystal.
  Equivalent of the asciidoctor-reveal.js Ruby gem (v5.2.0).
  Depends on asciicrystal (parser/AST).
  Ported from Ruby asciidoctor-revealjs 5.2.0.

authors:
  - Philippe Nénert <philippe@aloli.fr>

license: MIT

dependencies:
  asciicrystal:
    github: aloli-crystal/asciicrystal
    version: "~> 2.0.26.12"

development_dependencies:
  ameba:
    github: crystal-ameba/ameba
    version: "~> 1.6"

targets:
  asciicrystal-revealjs:
    main: bin/asciicrystal-revealjs

crystal: ">= 1.19.0"
